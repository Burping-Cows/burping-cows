name: Deploy landing page

on:
  push:
    branches:
      - codex/landing-page

permissions:
  contents: read

concurrency:
  group: burping-cows-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit permission. See DEPLOY.md."
            exit 1
          fi

      - name: Check out the landing-page branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the landing page
        run: npm run build

      - name: Check the latest branch commit
        id: branch-state
        run: |
          latest_sha="$(git ls-remote origin refs/heads/codex/landing-page | cut -f1)"
          if [ -z "$latest_sha" ]; then
            echo "::error::Could not verify the latest landing-page commit."
            exit 1
          fi
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "A newer branch commit exists; skipping this deployment."
          fi

      - name: Deploy the static site
        if: steps.branch-state.outputs.is_latest == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a6d8740a330b9414a5156037b16d70d6
          wranglerVersion: "4.147.0"
          command: pages deploy dist --project-name=burping-cows --branch=codex/landing-page
